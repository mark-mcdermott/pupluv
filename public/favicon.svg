<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="pupluv">
  <defs>
    <radialGradient id="coat" cx="36%" cy="28%" r="78%">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#ecdcc2"/>
    </radialGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b87c46"/>
      <stop offset="1" stop-color="#8a5527"/>
    </linearGradient>
    <linearGradient id="patch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b87c46"/>
      <stop offset="1" stop-color="#96612f"/>
    </linearGradient>
    <linearGradient id="tongue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4808f"/>
      <stop offset="1" stop-color="#dd5169"/>
    </linearGradient>
    <clipPath id="head">
      <ellipse cx="32" cy="27.5" rx="20.5" ry="19"/>
    </clipPath>
  </defs>

  <!-- Grounding shadow: what makes the emoji read as 3D rather than flat. -->
  <ellipse cx="32" cy="59" rx="15" ry="2.8" fill="#000" opacity=".16"/>

  <!-- Drawn before the head so the muzzle covers its root and only the
       lolling half shows. -->
  <path d="M26.5 38h11v10.5a5.5 5.5 0 0 1-11 0z" fill="url(#tongue)"/>
  <path d="M32 48v5.5" stroke="#c03e57" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>

  <g fill="url(#ear)">
    <ellipse cx="13.5" cy="30" rx="7.6" ry="13" transform="rotate(-13 13.5 30)"/>
    <ellipse cx="50.5" cy="30" rx="7.6" ry="13" transform="rotate(13 50.5 30)"/>
  </g>

  <ellipse cx="32" cy="27.5" rx="20.5" ry="19" fill="url(#coat)"/>

  <!-- The one eye spot, clipped so it cannot bleed past the cheek. -->
  <g clip-path="url(#head)">
    <ellipse cx="43.5" cy="22.5" rx="11.5" ry="11" fill="url(#patch)"/>
  </g>

  <ellipse cx="22.5" cy="25" rx="3.2" ry="3.5" fill="#2c211a"/>
  <ellipse cx="41.5" cy="25" rx="3.2" ry="3.5" fill="#2c211a"/>
  <circle cx="23.5" cy="23.7" r="1.1" fill="#fff" opacity=".9"/>
  <circle cx="42.5" cy="23.7" r="1.1" fill="#fff" opacity=".9"/>

  <ellipse cx="32" cy="34.5" rx="4.6" ry="3.4" fill="#2c211a"/>
  <ellipse cx="30.6" cy="33.5" rx="1.3" ry=".9" fill="#fff" opacity=".35"/>
</svg>
